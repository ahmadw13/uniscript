[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uniscript"
version = "0.1.0"
description = "Convert plain strings to Unicode subscript/superscript — no HTML, no LaTeX, just text."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["unicode", "subscript", "superscript", "text", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
uniscript = "uniscript._cli:main"

[project.urls]
Homepage = "https://github.com/Ahmed/uniscript"
Repository = "https://github.com/Ahmed/uniscript"
Issues = "https://github.com/Ahmed/uniscript/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["uniscript"]
